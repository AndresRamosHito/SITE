<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pollinaria and paternity: how orchid pollen shapes the next generation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EC; --bar:#FFFFFF; --text:#1F2A24; --muted:#5E6B63; --rule:#D3DBD4; --accent:#3F7A4C; --pink:#B5467F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#141A17;--bar:#1E2622;--text:#E7EEE9;--muted:#9AA8A0;--rule:#33403A;--accent:#8CC79A;--pink:#E08AB6;}
}
:root[data-theme="dark"]{--bg:#141A17;--bar:#1E2622;--text:#E7EEE9;--muted:#9AA8A0;--rule:#33403A;--accent:#8CC79A;--pink:#E08AB6;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Nunito,"Trebuchet MS",system-ui,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
#stagewrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
canvas{display:block;border-radius:6px;background:#000}
#bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bar);border-top:1px solid var(--rule);flex-wrap:wrap}
body.rec #bar{display:none}
body.rec{cursor:none}
button,select{font:700 15px Nunito,system-ui,sans-serif;color:var(--text);background:var(--bg);border:1px solid var(--rule);border-radius:6px;height:36px;padding:0 12px;cursor:pointer}
button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#play{min-width:84px}
#time{font:600 14px Nunito,system-ui,sans-serif;color:var(--muted);min-width:92px;font-variant-numeric:tabular-nums}
#scrubwrap{position:relative;flex:1;min-width:220px;height:36px}
#scrub{position:absolute;inset:0;width:100%;margin:0;accent-color:var(--accent)}
#marks{position:absolute;left:8px;right:8px;top:0;height:8px;pointer-events:none}
#marks span{position:absolute;top:0;width:2px;height:8px;background:var(--muted);opacity:.6}
#chap{font:700 14px Nunito,system-ui,sans-serif;color:var(--muted);min-width:200px}
.grp{display:flex;gap:6px;align-items:center}
</style>
</head>
<body>
<div id="app">
  <div id="stagewrap"><canvas id="cv" width="1600" height="900" aria-label="Animation: how orchid pollinaria concentrate paternity and shape the next generation"></canvas></div>
  <div id="bar">
    <button id="play" aria-label="Play or pause">Play</button>
    <span id="time">0:00 / 0:00</span>
    <div id="scrubwrap"><div id="marks"></div><input id="scrub" type="range" min="0" max="1000" step="1" value="0" aria-label="Timeline"></div>
    <span id="chap"></span>
    <div class="grp">
      <button id="prevc" aria-label="Previous chapter">Prev</button>
      <button id="nextc" aria-label="Next chapter">Next</button>
      <select id="speed" aria-label="Speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select>
      <button id="stops" aria-pressed="false" title="Pause at the end of every chapter">Pause per chapter</button>
      <button id="caps" aria-pressed="true">Captions</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
/* =====================================================================
   Pollinaria and paternity: a visual story of the orchid paternity model.
   Version 2. Every frame is a pure function of time t, so the timeline
   can be scrubbed, paused and stepped for voice-over recording.
   ===================================================================== */
const W=1600,H=900,TAU=Math.PI*2;
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const FONT='Nunito,"Trebuchet MS",system-ui,sans-serif';

/* ---------- maths helpers ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const eseg=(t,a,b)=>ease(seg(t,a,b));
function mk(seed){let s=seed>>>0;return function(){s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function normalR(R){let u=0;while(u===0)u=R();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*R());}
function poissonR(R,l){if(l<=0)return 0;const L=Math.exp(-l);let k=0,p=1;do{k++;p*=R();}while(p>L);return k-1;}
function gammaR(R,a){if(a<1)return gammaR(R,a+1)*Math.pow(R(),1/a);const d=a-1/3,c=1/Math.sqrt(9*d);for(;;){let x,v;do{x=normalR(R);v=1+c*x;}while(v<=0);v=v*v*v;const u=R();if(u<1-0.0331*x*x*x*x)return d*v;if(Math.log(u)<0.5*x*x+d*(1-v+Math.log(v)))return d*v;}}
function pickW(R,items,wts){let s=0;for(const w of wts)s+=w;let u=R()*s;for(let i=0;i<items.length;i++){u-=wts[i];if(u<=0)return items[i];}return items[items.length-1];}
function shuffle(R,a){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- colours ---------- */
const hsl=(h,s,l,a)=>a===undefined?`hsl(${h},${s}%,${l}%)`:`hsla(${h},${s}%,${l}%,${a})`;
const HUES=[352,24,205,100,168,290,238,48];
const alleleCol=id=>{if(id>=16)return (id&1)?"#2E2E33":"#F2F2F2";const h=HUES[(id>>1)%8];return (id&1)?hsl(h,62,38):hsl(h,80,68);};
const sireCol=f=>hsl(HUES[f%8],65,50);
const C={skyTop:"#B7D7E8",skyBot:"#EAF3EE",hill:"#A8C79A",hill2:"#90B882",trees:"#6E9A67",grass:"#7EAA66",soil:"#6B5A45",soil2:"#4F4033",
  sepal:"#B9B77E",petal:"#C58FAE",lip:"#8A2F66",lipDark:"#561A40",throat:"#DDA7C6",column:"#FCF5F9",stem:"#4E8A4A",leaf:"#5E9F57",leafDark:"#4A8545",
  wilt:"#B39C82",fruit:"#6E9E4E",fruitDark:"#557F3B",pollen:"#F2C12E",pollenDark:"#C99A12",visc:"#6A4A2E",
  capBg:"rgba(18,30,24,0.8)",ink:"#1F2A24",gold:"#F2B632",card:"#FBFBF8"};

/* ---------- drawing primitives ---------- */
function ell(x,y,rx,ry,rot,fill,stroke,lw){ctx.beginPath();ctx.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),rot||0,0,TAU);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();}}
function circ(x,y,r,fill,stroke,lw){ell(x,y,r,r,0,fill,stroke,lw);}
function rrect(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function mixHex(a,b,t){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const r=Math.round(lerp(pa>>16,pb>>16,t)),g=Math.round(lerp(pa>>8&255,pb>>8&255,t)),bl=Math.round(lerp(pa&255,pb&255,t));return `rgb(${r},${g},${bl})`;}
function text(s,x,y,size,col,align,weight,italic){ctx.font=`${italic?"italic ":""}${weight||700} ${size}px ${FONT}`;ctx.fillStyle=col;ctx.textAlign=align||"left";ctx.textBaseline="middle";ctx.fillText(s,x,y);}
function lines(s,maxW,size,weight){ctx.font=`${weight||700} ${size}px ${FONT}`;const out=[];let line="";for(const w of s.split(" ")){const t=line?line+" "+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;}if(line)out.push(line);return out;}
function para(s,x,y,maxW,size,col,lh,align,weight){const L=lines(s,maxW,size,weight);L.forEach((l,i)=>text(l,x,y+i*lh,size,col,align,weight));return L.length;}
function fade(a,fn){if(a<=0)return;ctx.save();ctx.globalAlpha*=a;fn();ctx.restore();}
function card(x,y,w,h,r){rrect(x,y,w,h,r||16);ctx.fillStyle=C.card;ctx.fill();ctx.strokeStyle="rgba(0,0,0,0.08)";ctx.lineWidth=1;ctx.stroke();}
function arrow(x1,y1,x2,y2,col,lw){ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=lw||2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();const a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-12*Math.cos(a-0.4),y2-12*Math.sin(a-0.4));ctx.lineTo(x2-12*Math.cos(a+0.4),y2-12*Math.sin(a+0.4));ctx.closePath();ctx.fill();}

/* Allele badge: two beads in a pill */
function beads(x,y,a,b,r,alpha){if(alpha<=0)return;ctx.save();ctx.globalAlpha*=alpha;r=r||7;rrect(x-r*2.6,y-r*1.45,r*5.2,r*2.9,r*1.45);ctx.fillStyle="rgba(255,255,255,0.94)";ctx.fill();ctx.strokeStyle="rgba(40,50,45,0.35)";ctx.lineWidth=1;ctx.stroke();circ(x-r*1.2,y,r,alleleCol(a),"rgba(0,0,0,0.25)",1);circ(x+r*1.2,y,r,alleleCol(b),"rgba(0,0,0,0.25)",1);ctx.restore();}

/* Chromosome with one gene locus marked */
function chromo(x,y,len,w,allele,alpha,label){fade(alpha,()=>{const h1=len*0.42,h2=len*0.52;rrect(x-w/2,y-len/2,w,h1,w/2);ctx.fillStyle="#9EA3B8";ctx.fill();rrect(x-w/2,y-len/2+h1+len*0.06,w,h2,w/2);ctx.fill();
  ctx.fillStyle=alleleCol(allele);ctx.fillRect(x-w/2,y-len/2+len*0.18,w,len*0.1);ctx.strokeStyle="rgba(0,0,0,0.25)";ctx.lineWidth=1;rrect(x-w/2,y-len/2,w,h1,w/2);ctx.stroke();rrect(x-w/2,y-len/2+h1+len*0.06,w,h2,w/2);ctx.stroke();
  if(label)text(label,x,y+len/2+22,18,"#FFFFFF","center",700);});}

/* Orchid flower, front view, centred on its column. s = size scale. */
function flower(x,y,s,o){
  /* Stylised Eulophia alta, front view, centred on the column.
     Lanceolate bronze-maroon tepals over green, three-lobed labellum:
     side lobes around the column, white disc with dark keels, frilled crimson midlobe.
     Anther cap near (0,-10.5); stigma under the column tip near (0,1). */
  o=o||{};const open=o.open===undefined?1:o.open;if(open<=0)return;
  const w=o.wilt||0;ctx.save();ctx.translate(x,y);ctx.globalAlpha*=(o.alpha===undefined?1:o.alpha)*(1-w*0.55);
  const sc=s*(0.25+0.75*open)*(1-w*0.35);ctx.scale(sc,sc);ctx.rotate(w*0.5);
  const col=c=>w>0?mixHex(c,C.wilt,w):c;const lw=Math.max(0.25,0.6/sc*Math.min(s,3));const det=s>2.5;
  const lance=(ang,len,wd,base,cBase,cTip,edge)=>{ctx.save();ctx.rotate(ang);const L=len*open;
    ctx.beginPath();ctx.moveTo(-wd*0.45,-base);ctx.bezierCurveTo(-wd*1.05,-base-L*0.3,-wd*0.8,-base-L*0.75,0,-base-L);ctx.bezierCurveTo(wd*0.8,-base-L*0.75,wd*1.05,-base-L*0.3,wd*0.45,-base);ctx.closePath();
    const g=ctx.createLinearGradient(0,-base,0,-base-L);g.addColorStop(0,col(cBase));g.addColorStop(0.35,col(mixHexRaw(cBase,cTip,0.6)));g.addColorStop(1,col(cTip));ctx.fillStyle=g;ctx.fill();
    ctx.strokeStyle=col(edge);ctx.lineWidth=lw;ctx.stroke();
    if(det){ctx.strokeStyle=col("#A7B86A");ctx.globalAlpha*=0.5;ctx.lineWidth=0.35;ctx.beginPath();ctx.moveTo(0,-base);ctx.lineTo(0,-base-L*0.9);ctx.stroke();ctx.globalAlpha/=0.5;
      ctx.fillStyle=col("#4E2626");ctx.globalAlpha*=0.35;const R=mk(Math.round(ang*100)+7);for(let k=0;k<22;k++){const u=0.25+R()*0.7;ctx.beginPath();ctx.arc((R()-.5)*wd*1.3*(1-u*0.6),-base-L*u,0.35,0,TAU);ctx.fill();}ctx.globalAlpha/=0.35;}
    ctx.restore();};
  // petals and dorsal sepal
  // lateral sepals sit tight against the labellum in E. alta, so they are hidden behind it
  lance(0.78,40,8.5,5,"#7E8E45","#6A3434","#4A2424");lance(-0.78,40,8.5,5,"#7E8E45","#6A3434","#4A2424");
  lance(0,42,7.5,6,"#8A9A4E","#6A3232","#4A2424");
  // labellum: side lobes
  for(const d of [-1,1]){ctx.beginPath();ctx.moveTo(d*3,-9);ctx.bezierCurveTo(d*13,-11,d*15,4,d*9,14*open);ctx.lineTo(d*4,12*open);ctx.closePath();
    const g=ctx.createLinearGradient(d*14,0,d*3,0);g.addColorStop(0,col("#6B2C34"));g.addColorStop(1,col("#9DAF5A"));ctx.fillStyle=g;ctx.fill();ctx.strokeStyle=col("#4A1C24");ctx.lineWidth=lw;ctx.stroke();}
  // midlobe: frilled crimson
  const my=22*open;
  ctx.beginPath();const N=40;for(let k=0;k<=N;k++){const a=TAU*(k/N);const fr=1+0.07*Math.sin(k*5.3)+0.04*Math.sin(k*11.7);const px=Math.cos(a)*12.5*fr,py=my+Math.sin(a)*11*open*fr;if(k===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}ctx.closePath();
  const mg=ctx.createRadialGradient(0,my-2,1,0,my+4,15);mg.addColorStop(0,col("#C4405C"));mg.addColorStop(1,col("#8C1D3A"));ctx.fillStyle=mg;ctx.fill();
  if(det){const R=mk(5);ctx.fillStyle=col("#E07A92");for(let k=0;k<70;k++){const a=R()*Math.PI,r=Math.sqrt(R());circ(Math.cos(a)*11*r,my-2+Math.sin(a)*10*open*r,0.35+R()*0.35,null);ctx.fill();}}
  // white disc with dark keels
  ctx.beginPath();ctx.moveTo(-6,-2);ctx.bezierCurveTo(-7,8,-6,my-2,0,my-1);ctx.bezierCurveTo(6,my-2,7,8,6,-2);ctx.closePath();ctx.fillStyle=col("#F7F3EC");ctx.fill();
  ctx.strokeStyle=col("#7A1E30");ctx.lineWidth=Math.max(0.35,0.9/sc*Math.min(s,3));for(const d of [-2.6,2.6]){ctx.beginPath();ctx.moveTo(d,my-9);ctx.lineTo(d*1.1,my-3);ctx.stroke();}
  // column: yellow-green with orange anther cap
  ell(0,-5,4.4,7.2,0,col("#D2DB7E"),col("#8C9442"),lw);ell(0,-10.5,3.3,2.7,0,col("#E57A2A"),col("#A8501A"),lw*0.8);
  if(o.stigma){ell(0,1,2.4,1.9,0,"rgba(120,110,60,0.55)");ell(-.6,.5,.8,.5,0,"rgba(255,255,255,0.8)");}
  if(o.pollinarium!==false&&!o.bigParcel){ell(-1.3,-10,1.1,1.4,0,C.pollen);ell(1.3,-10,1.1,1.4,0,C.pollen);}
  ctx.restore();
}
function mixHexRaw(a,b,t){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const h=v=>v.toString(16).padStart(2,"0");return "#"+h(Math.round(lerp(pa>>16,pb>>16,t)))+h(Math.round(lerp(pa>>8&255,pb>>8&255,t)))+h(Math.round(lerp(pa&255,pb&255,t)));}
function capsule(x,y,s,sw,o){o=o||{};ctx.save();ctx.translate(x,y);ctx.globalAlpha*=(o.alpha===undefined?1:o.alpha);ctx.scale(s,s);
  const split=o.split||0;
  ctx.strokeStyle=C.stem;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(0,-18*sw);ctx.lineTo(0,-24);ctx.stroke();
  const body=o.grey?"#9C9A8F":C.fruit;
  if(split>0){[-1,1].forEach(d=>{ctx.save();ctx.rotate(d*split*0.5);ell(d*3*split,0,5.5*sw,17*sw,0,body,C.fruitDark,.8);ctx.restore();});}
  else{const g=ctx.createLinearGradient(-8*sw,0,8*sw,0);g.addColorStop(0,o.grey?"#8A887E":"#5E8E40");g.addColorStop(0.5,o.grey?"#A9A79C":"#8BB866");g.addColorStop(1,o.grey?"#8A887E":"#5E8E40");ell(0,0,8*sw,17*sw,0,g,C.fruitDark,.8);ctx.strokeStyle="rgba(40,70,30,0.45)";ctx.lineWidth=.7;[-3,0,3].forEach(dx=>{ctx.beginPath();ctx.moveTo(dx*sw,-15*sw);ctx.quadraticCurveTo(dx*1.6*sw,0,dx*sw,15*sw);ctx.stroke();});}
  ctx.restore();}

/* Bee: local frame faces +x. Pollinarium geometry is in this frame so pickup is seamless. */
function bee(x,y,s,ang,t,o){o=o||{};ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.scale(s,s);
  const flap=o.still?0.3:Math.abs(Math.sin(t*55));
  ctx.strokeStyle="#2A2320";ctx.lineWidth=1.3;for(const sx of [-4,2,8]){ctx.beginPath();ctx.moveTo(sx,5);ctx.lineTo(sx-3,12);ctx.moveTo(sx,-5);ctx.lineTo(sx-3,-12);ctx.stroke();}
  ctx.save();ctx.beginPath();ctx.ellipse(-12,0,15,10.5,0,0,TAU);ctx.fillStyle="#F2B632";ctx.fill();ctx.clip();ctx.fillStyle="#2A2320";for(const bx of [-22,-14,-6])ctx.fillRect(bx,-12,4,24);ctx.restore();
  ell(-12,0,15,10.5,0,null,"#2A2320",.8);
  circ(4,0,8.5,"#7A5532");if(s>2){ctx.strokeStyle="rgba(240,200,120,0.6)";ctx.lineWidth=0.4;const R=mk(5);for(let i=0;i<30;i++){const a=R()*TAU;ctx.beginPath();ctx.moveTo(4+Math.cos(a)*7,Math.sin(a)*7);ctx.lineTo(4+Math.cos(a)*9.5,Math.sin(a)*9.5);ctx.stroke();}}
  circ(15,0,6.5,"#2A2320");ell(17,-3,2,2.6,0,"#555");ell(17,3,2,2.6,0,"#555");
  ctx.strokeStyle="#2A2320";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(19,-3);ctx.quadraticCurveTo(25,-8,27,-12);ctx.moveTo(19,3);ctx.quadraticCurveTo(25,8,27,12);ctx.stroke();
  ctx.globalAlpha*=0.55;ell(0,-11-8*flap,5,13*(0.5+0.5*flap),-0.35,"#FFFFFF","rgba(80,90,100,0.6)",.6);ell(0,11+8*flap,5,13*(0.5+0.5*flap),0.35,"#FFFFFF","rgba(80,90,100,0.6)",.6);
  ctx.globalAlpha/=0.55;
  if(o.parcel)pollinarium(o.parcel);
  ctx.restore();}
/* pollinarium in bee-local units: viscidium at (22,0), stipe to (28,0), two pollinia near (31,+-2.8) */
function pollinarium(p){const g=p.grains;ctx.save();
  if(!p.noStalk){ctx.strokeStyle=C.pollenDark;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(22,0);ctx.lineTo(28.5,0);ctx.stroke();circ(22,0,1.5,C.visc);}
  const pol=p.empty?[]:(p.one?[p.one]:[-1,1]);
  for(const d of pol){ell(31.5,d*2.8,3.4,2.4,0,C.pollen,C.pollenDark,.5);
    if(g){ctx.save();ctx.beginPath();ctx.ellipse(31.5,d*2.8,3.2,2.2,0,0,TAU);ctx.clip();const R=mk(7+d);for(let i=0;i<26;i++){circ(31.5+(R()-.5)*6.4,d*2.8+(R()-.5)*4.4,.42,alleleCol(g[(i+(d>0?1:0))%2]));}ctx.restore();}}
  ctx.restore();}
function inBeeFrame(x,y,s,ang,fn){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.scale(s,s);fn();ctx.restore();}

/* Dust seed: testa with an embryo carrying one maternal and one paternal allele */
function seedShape(x,y,s,a,b,alpha,ring){ctx.save();ctx.globalAlpha*=alpha===undefined?1:alpha;ctx.translate(x,y);ctx.scale(s,s);
  ell(0,0,19,7.5,0,"rgba(238,226,196,0.95)","rgba(120,95,60,0.6)",.8);ell(0,0,10,5.6,0,"#C9B089");circ(-4.3,0,3.8,alleleCol(a),"rgba(0,0,0,0.3)",.6);circ(4.3,0,3.8,alleleCol(b),ring||"rgba(0,0,0,0.3)",ring?1.6:.6);ctx.restore();}

/* ---------- world: the founding meadow ---------- */
const GY=700;
const PX=i=>140+i*190;
const FLOWERING=[0,1,2,3,4,5,7];
const FS=1.5;
const flowerPos=(x,slot,sc)=>{sc=sc||1;return slot===0?[x+6*sc,GY-340*sc]:[x+46*sc,GY-250*sc];};
function plant(x,sc,st){
  const g=st.grow===undefined?1:st.grow;if(g<=0)return;const a=1-(st.fade||0);if(a<=0)return;

function makeStory(seed){
  const R=mk(seed);
  const wts={};FLOWERING.forEach(i=>wts[i]=gammaR(R,0.6));
  const fruits=[],unvisited=[];
  for(const m of FLOWERING)for(let slot=0;slot<2;slot++){
    if(m===5&&slot===0){fruits.push({m,slot,f:2,pass:true,story:true});continue;}
    if(R()<0.7){const cand=FLOWERING.filter(j=>j!==m);const f=pickW(R,cand,cand.map(j=>wts[j]));const fr={m,slot,f,pass:R()<0.5};
      if(R()<0.3){const c2=cand.filter(j=>j!==f);fr.f2=pickW(R,c2,c2.map(j=>wts[j]));fr.s2=0.15+R()*0.2;}fruits.push(fr);}

  const nS=seedlings.length;if(nS<18||nS>28)return null;
  const nF=fruits.length,nP=fruits.filter(f=>f.pass).length;if(nF<9||nF>12||nP<4||nP>7)return null;
  if(!fruits.some(f=>f.f2!==undefined&&f.pass))return null;
  const idx=shuffle(R,seedlings.map((_,i)=>i));const winners=idx.slice(0,8);const wset=new Set(winners);
  const NSL=28,slotX=k=>70+k*(1460/(NSL-1));
  const wSlots=[...Array(8)].map((_,k)=>Math.round((k+0.5)*NSL/8-0.5));
  const free=shuffle(R,[...Array(NSL).keys()].filter(k=>!wSlots.includes(k)));
  let wi=0,li=0;seedlings.forEach((s,i)=>{s.win=wset.has(i);s.x=slotX(s.win?wSlots[wi++]:free[li++]);s.wrank=s.win?winners.indexOf(i):-1;});
  const tally=Array(8).fill(0);seedlings.forEach(s=>{if(s.win)tally[s.f]++;});
  const zeros=FLOWERING.filter(i=>tally[i]===0).length;const mx=Math.max(...tally);
  if(mx<3||mx>4||zeros<3||tally.filter(v=>v>=2).length<2)return null;
  if(!seedlings.some(s=>s.win&&s.fi===0))return null;
  const trips=shuffle(R,fruits.map((_,i)=>i).filter(i=>!fruits[i].story));
  trips.forEach((fi,k)=>{fruits[fi].t0=0.6+k*0.85;});
  fruits.forEach(fr=>{fr.dust=[...Array(34)].map(()=>({vx:(R()-.3)*170,vy:-(40+R()*120),sway:R()*TAU,life:4+R()*2.5}));});
  const flick=[...Array(60)].map(()=>Math.floor(R()*nS));
  return {fruits,unvisited,seedlings,winners,tally,flick,seed};
}

/* ---------- many generations: a tiny version of the v3.3 regimes ---------- */
const LOW={lam:1.2,e:0.62,al:0.7,b:3,kmax:4},GRAN={lam:3.5,e:0,al:1.5,b:1,kmax:8};
function runWorld(reg,seed,N,G,init){
  const R=mk(seed);let pop=init.map(p=>p.slice());const gens=[];
  for(let g=0;g<=G;g++){
    const rec={pop:pop.map(p=>p.slice()),tally:null,colours:new Set(pop.flat()).size};gens.push(rec);if(g===G)break;
    const fl=[];pop.forEach((p,i)=>{if(R()<0.7)fl.push(i);});if(fl.length<2)break;
    const w=fl.map(()=>gammaR(R,0.6));const kids=[];
    fl.forEach(m=>{let nf=0;const nfl=poissonR(R,6);for(let k=0;k<nfl;k++)if(R()<0.25)nf++;
      for(let k=0;k<nf;k++){
        const draw=()=>{for(;;){const f=pickW(R,fl,w);if(f!==m)return f;}};
        let extra=0;const D=poissonR(R,reg.lam);for(let j=0;j<D;j++)if(R()<1-reg.e)extra++;
        const kk=Math.min(1+extra,reg.kmax);const fathers=[];for(let j=0;j<kk;j++)fathers.push(draw());
        let shares;if(kk===1)shares=[1];else{const al=fathers.map(()=>reg.al);al[0]*=reg.b;const gs=al.map(a=>gammaR(R,a));const s=gs.reduce((a,b)=>a+b,0);shares=gs.map(x=>x/s);}
        if(R()>=0.5)continue;const nr=poissonR(R,10);
        for(let r=0;r<nr;r++){const f=pickW(R,fathers,shares);kids.push({a:pop[m][R()<.5?0:1],b:pop[f][R()<.5?0:1],f});}
      }});
    shuffle(R,kids);const keep=kids.slice(0,N);
    const tally=Array(N).fill(0);keep.forEach(k=>tally[k.f]++);rec.tally=tally;
    if(keep.length<2)break;pop=keep.map(k=>[k.a,k.b]);
  }
  return gens;
}

function topShare(t){const s=t.slice().sort((a,b)=>b-a);const tot=s.reduce((a,b)=>a+b,0);return tot?(s[0]+s[1]+s[2])/tot:0;}
const WSTAT=(function(){let a=0,b=0,n=0,ca=0,cb=0,reps=0;for(let r=0;r<200;r++){const init=initPop(1000+r);const A=runWorld(LOW,5000+r,NW,GW,init),B=runWorld(GRAN,5000+r,NW,GW,init);
    if(A.length<GW+1||B.length<GW+1)continue;for(let g=0;g<GW;g++){a+=topShare(A[g].tally);b+=topShare(B[g].tally);n++;}ca+=A[GW].colours;cb+=B[GW].colours;reps++;}
  return{pollinaria:a/n,loose:b/n,colP:ca/reps,colL:cb/reps};})();

function meadowFruit(i,tc,o){
  const st=founderState(i,{noParcel:2});if(!st.flowering)return st;

    const w=eseg(tc,12,13.6);return{open:1,wilt:w,alpha:1-w};});
  return st;}

  STORY.seedlings.forEach(s=>{if(!s.win){seedling(s.x,1,1,(1-eseg(t,0,1.2))*0.15,1.8);return;}

    plant(s.x,0.82,{grow:g,flowering:true,badge:[s.a,s.b,1],flowers:[{open:eseg(t,9.8,11)},{open:eseg(t,10.1,11.3)}]});});
  fade(eseg(t,4.6,5.4)*(1-eseg(t,9.8,10.4)),()=>{card(420,60,760,100,16);text("generation 1 dead, generation 2 growing",800,95,26,C.ink,"center",800);text("no overlap between generations",800,130,19,"#5E6B63","center",700);});
  vignette();
});

/* 14 */
function newGen(t){background(t,0.55);STORY.seedlings.forEach(s=>{if(s.win)plant(s.x,0.82,{grow:1,flowering:true,badge:[s.a,s.b,1],flowers:[{open:1},{open:1}]});});}
chapter("Who sired the next generation?",15,[
  [0,"Let's count how many of the new plants each plant of the old generation sired."],
  [4.6,"A few plants sired several new plants. Many sired none at all."],
  [9.6,"This inequality among sires is male reproductive skew, the quantity the model measures. Concentrated paternity within capsules raises it."]],
function(t){
  newGen(t);fade(eseg(t,0.4,1.4),()=>{
    rrect(140,90,1320,560,20);ctx.fillStyle="#F7F7F5";ctx.fill();
    text("new plants sired by each plant of the previous generation",800,140,28,C.ink,"center",800);
    const base=560;
    for(let i=0;i<8;i++){const x=260+i*155;beads(x,base+36,i*2,i*2+1,11,1);
      if(!FLOWERING.includes(i)){text("did not flower",x,base-30,18,"#8A8A8A","center",700);continue;}
      const n=STORY.tally[i];for(let k=0;k<n;k++){const a=eseg(t,1.6+i*0.25+k*0.3,2.2+i*0.25+k*0.3);fade(a,()=>{
        const y=base-24-k*82;ctx.strokeStyle=C.stem;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y+26);ctx.lineTo(x,y-6);ctx.stroke();flower(x,y-20,0.95,{});});}
      fade(eseg(t,4.2,5),()=>text(n===0?"none":String(n),x,base+84,26,n===0?"#8A8A8A":C.ink,"center",800));}});
});

/* 15 */
const GEN_T=3.2,W12_START=5;
function worldPanel(x0,title,sub,gens,t,side){
  text(title,x0+370,56,28,"#FFFFFF","center",800);text(sub,x0+370,88,17,"rgba(255,255,255,0.8)","center",700);
  const gf=(t-W12_START)/GEN_T;const g=clamp(Math.floor(gf),0,GW);const within=clamp(gf-g,0,1);
  const cur=gens[Math.min(g,gens.length-1)],prev=gens[Math.max(0,Math.min(g-1,gens.length-1))];
  const fadeIn=g===0?1:eseg(within,0,0.35);
  text(`generation ${g}`,x0+370,120,21,"#FFFFFF","center",800);
  for(let i=0;i<NW;i++){const c=i%6,r=Math.floor(i/6);const x=x0+80+c*118,y=180+r*82;
    if(fadeIn<1)fade(1-fadeIn,()=>{flower(x,y,0.78,{pollinarium:false});beads(x,y+36,prev.pop[i][0],prev.pop[i][1],7,1);});
    fade(fadeIn,()=>{flower(x,y,0.78,{pollinarium:false});beads(x,y+36,cur.pop[i][0],cur.pop[i][1],7,1);});}
  const tal=g>0?gens[g-1].tally:null;const bx=x0+60,by=690,bw=620;
  text("new plants per sire, most to fewest",x0+370,592,19,"rgba(255,255,255,0.85)","center",700);
  ctx.fillStyle="rgba(255,255,255,0.25)";ctx.fillRect(bx,by,bw,2);
  if(tal){const s=tal.slice().sort((a,b)=>b-a);const mx=Math.max(8,s[0]);const gw=bw/NW;const u=eseg(within,0.1,0.6);
    s.forEach((v,k)=>{const h=v/mx*76*u;rrect(bx+k*gw+2,by-h,gw-4,h,3);ctx.fillStyle=side?"#9CC8F0":"#F2A9CC";ctx.fill();});}
  text(`allele colours still present: ${cur.colours} of 16`,x0+370,722,20,"#FFFFFF","center",700);
}
chapter("Many generations, two populations",W12_START+GEN_T*(GW+1)+4,[
  [0,"Let's speed up and compare two small populations over many generations."],
  [W12_START,"Left: pollinaria, with paternity concentrated in each capsule. Right: loose pollen, with several sires per fruit. Everything else is identical."],
  [W12_START+GEN_T*2.2,"Watch the bars. With pollinaria, fewer sires produce most of the new plants in each generation."],
  [W12_START+GEN_T*5.4,"Both populations lose allele colours by chance at a similar pace. Paternity differs far more than the allele mix."]],
function(t){
  closeupBg();ctx.fillStyle="rgba(0,0,0,0.2)";ctx.fillRect(799,24,2,H-48);
  worldPanel(30,"pollinaria","low-sire regime",WORLD.A,t,0);worldPanel(830,"loose pollen","granular reference",WORLD.B,t,1);
  const end=W12_START+GEN_T*(GW+1);
  fade(eseg(t,end-0.6,end+0.4),()=>{card(230,270,1140,280,18);
    text("Averaged over 200 simulated populations",800,318,26,C.ink,"center",800);
    text(`new plants from the top 3 sires: pollinaria ${Math.round(WSTAT.pollinaria*100)}%, loose pollen ${Math.round(WSTAT.loose*100)}%`,800,378,24,C.ink,"center",700);
    text(`allele colours left after ${GW} generations: pollinaria ${WSTAT.colP.toFixed(1)}, loose pollen ${WSTAT.colL.toFixed(1)} (of 16)`,800,428,24,C.ink,"center",700);
    text("30 plants each, v3.3 regime settings; far smaller than the model's 500, for illustration",800,488,18,"#6B6B6B","center",700);});
});

/* ---------- input from outside ---------- */
const OUTF=(function(){const w=STORY.seedlings.filter(s=>s.win).sort((a,b)=>b.x-a.x);return w[1];})();
const OUT_SEEDS=[{x:1015,d:0},{x:1265,d:0.5},{x:1450,d:1}].map(s=>({...s,a:16,b:17}));
function farPlants(t){for(let i=0;i<9;i++){const x=1250+i*40,y=GY-150+Math.sin(i)*6;ctx.strokeStyle="#4E7A48";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,y+30);ctx.lineTo(x,y);ctx.stroke();flower(x,y,0.45,{pollinarium:false});}}
chapter("Pollen and plants from outside",23,[
  [0,"Real populations are rarely closed. Pollinators can arrive carrying pollinaria from another population."],
  [5.6,"Seeds, and so new plants, can drift in from outside too, carrying alleles the population did not have."],
  [11,"The model includes both: x, the share of sires from outside, and m, the rate of immigration."],
  [16,"With more outside input, the allele mix differs less between pollinaria and loose pollen. The inequality among sires remains."]],
function(t){
  background(t);
  fade(eseg(t,0.3,1.2),()=>{card(1250,150,320,54,14);text("from a neighbouring population",1410,177,18,C.ink,"center",800);arrow(1500,215,1585,215,"#1F2A24",3);});
  const F=flowerPos(OUTF.x,0,0.82);const arr=eseg(t,1.2,4.4);const done=t>=4.4;
  STORY.seedlings.forEach(s=>{if(!s.win)return;const isT=s===OUTF;const fr=isT?seg(t,4.4,5.4):0;
    plant(s.x,0.82,{grow:1,flowering:true,badge:[s.a,s.b,1],flowers:[isT&&fr>0?{fruit:fr,tag:"out",tagA:0}:{open:1},{open:1}]});});
  if(t>=4.4)fade(seg(t,4.4,5.4),()=>{circ(F[0]+22*0.82,F[1]+14*0.82-6*0.82,8,"#F4F4F4","#222",2.5);text("outside sire",F[0]+40,F[1]-30,17,"#1F2A24","left",800);});
  if(t>=1.2&&t<4.6){const x=lerp(1700,F[0]+20,arr),y=lerp(F[1]-160,F[1]-10,arr)-Math.sin(arr*Math.PI)*60;bee(x,y,1.7,Math.PI,t,{parcel:{}});}
  OUT_SEEDS.forEach((s,i)=>{const u=seg(t,5.8+s.d,8.4+s.d);if(u>0&&u<1){const R=mk(90+i);for(let k=0;k<10;k++){const off=(R()-.5)*120;circ(lerp(1700,s.x+off*(1-u),u),lerp(260+R()*120,GY-2,u*u),3.2,"#8E7A55");}}
    const g=eseg(t,8.4+s.d,9.6+s.d);if(g>0){seedling(s.x,g,0,1,1.8);beads(s.x,GY+32,s.a,s.b,8,g);}});
  fade(eseg(t,8.8,9.6),()=>text("immigrant seedlings: new alleles",1240,GY+76,18,"#FFFFFF","center",800));
  fade(eseg(t,11,11.8),()=>{card(300,70,1000,250,18);
    text("model settings compared",800,106,20,"#5E6B63","center",800);
    [["lower input","x = 0.01, m = 0","1 sire in 100 from outside, no immigrants"],["higher input","x = 0.25, m = 0.03","1 sire in 4 from outside, about 15 immigrants per 500"]].forEach(([a,b,c],i)=>{const y=160+i*72;text(a,340,y,24,C.ink,"left",800);text(b,560,y,24,C.ink,"left",800);text(c,800,y+26,17,"#5E6B63","left",700);});
    fade(eseg(t,16,16.8),()=>{ctx.fillStyle="rgba(0,0,0,0.07)";ctx.fillRect(330,300,940,1);});});
  fade(eseg(t,16,16.8),()=>{card(300,338,1000,110,18);text("more input: smaller allele-diversity difference between regimes",800,372,22,C.ink,"center",800);text("sire inequality still higher with concentrated paternity",800,410,22,C.ink,"center",800);});
});

/* 16 */
chapter("What to remember",16,[[0,""]],function(t){
  newGen(t);ctx.fillStyle="rgba(15,25,20,0.45)";ctx.fillRect(0,0,W,H);
  const L=["Pollinaria deliver pollen in cohesive pollinia, so a capsule's seeds are usually sired mostly by one donor.",
           "After seedlings compete for limited space, a few sires leave many offspring and many leave none.",
           "The overall allele mix changes much less. How much depends on population size and incoming pollen."];
  L.forEach((s,i)=>{const a=eseg(t,0.6+i*3.2,1.6+i*3.2);fade(a,()=>{card(240,90+i*205,1120,175,18);
    circ(310,177+i*205,26,[sireCol(2),C.gold,sireCol(5)][i]);text(String(i+1),310,178+i*205,26,"#FFFFFF","center",800);
    const L2=lines(s,940,31,800);L2.forEach((l,j)=>text(l,370,177+i*205-(L2.length-1)*21+j*42,31,C.ink,"left",800));});});
});

let acc=0;CH.forEach(c=>{c.start=acc;acc+=c.dur;});const TOTAL=acc;

/* ---------- captions and chapter label ---------- */
let showCaps=true;
function drawOverlay(ci,lt){
  const c=CH[ci];
  fade(0.92*(1-eseg(lt,4,5)),()=>{ctx.font=`800 22px ${FONT}`;const lab=`${ci+1}  ${c.name}`;const w=ctx.measureText(lab).width+36;rrect(28,24,w,44,22);ctx.fillStyle="rgba(255,255,255,0.92)";ctx.fill();text(lab,46,47,22,C.ink,"left",800);});
  if(!showCaps)return;
  let cap=null,cs=0;for(const [ts,s] of c.caps){if(lt>=ts){cap=s;cs=ts;}}
  if(!cap)return;
  fade(eseg(lt,cs,cs+0.4),()=>{const L=lines(cap,1180,29,700);const h=L.length*40+28;rrect(800-640,H-h-26,1280,h,16);ctx.fillStyle=C.capBg;ctx.fill();
    L.forEach((l,i)=>text(l,800,H-h-26+34+i*40,29,"#FFFFFF","center",700));});
}

/* ---------- render and player ---------- */
let T=0,playing=false,speed=1,stops=false,lastNow=null,scale=1;
function chapterAt(t){for(let i=CH.length-1;i>=0;i--)if(t>=CH[i].start)return i;return 0;}
function render(){
  const dpr=window.devicePixelRatio||1;ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);ctx.clearRect(0,0,W,H);
  const ci=chapterAt(T),lt=T-CH[ci].start;
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();CH[ci].draw(lt);ctx.restore();
  if(ci>0&&lt<0.5){ctx.save();ctx.globalAlpha=1-lt/0.5;ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();CH[ci-1].draw(CH[ci-1].dur-0.001);ctx.restore();}
  drawOverlay(ci,lt);ui(ci);
}
const $=id=>document.getElementById(id);
const fmtT=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
function ui(ci){$("time").textContent=`${fmtT(T)} / ${fmtT(TOTAL)}`;$("scrub").value=Math.round(T/TOTAL*1000);$("chap").textContent=`${ci+1}. ${CH[ci].name}`;$("play").textContent=playing?"Pause":"Play";}
function tick(now){
  if(playing){if(lastNow!==null){const dt=Math.min(0.1,(now-lastNow)/1000)*speed;const ci=chapterAt(T);const end=CH[ci].start+CH[ci].dur;let nt=T+dt;
      if(stops&&T<end-0.02&&nt>=end-0.02){nt=end-0.02;playing=false;}
      T=Math.min(TOTAL,nt);if(T>=TOTAL)playing=false;}
    lastNow=now;}else lastNow=null;
  render();requestAnimationFrame(tick);
}
function fit(){const wrap=$("stagewrap");const aw=wrap.clientWidth-8,ah=wrap.clientHeight-8;scale=Math.max(0.1,Math.min(aw/W,ah/H));const dpr=window.devicePixelRatio||1;
  cv.style.width=Math.round(W*scale)+"px";cv.style.height=Math.round(H*scale)+"px";cv.width=Math.round(W*scale*dpr);cv.height=Math.round(H*scale*dpr);}
window.addEventListener("resize",fit);
const marks=$("marks");CH.forEach(c=>{const s=document.createElement("span");s.style.left=(c.start/TOTAL*100)+"%";marks.appendChild(s);});
function toggle(){if(T>=TOTAL-0.01)T=0;playing=!playing;}
function goCh(d){const ci=chapterAt(T);const lt=T-CH[ci].start;let n=ci+d;if(d<0&&lt>1.5)n=ci;T=CH[clamp(n,0,CH.length-1)].start;}
$("play").onclick=toggle;$("prevc").onclick=()=>goCh(-1);$("nextc").onclick=()=>goCh(1);
$("scrub").oninput=e=>{T=e.target.value/1000*TOTAL;};
$("speed").onchange=e=>{speed=+e.target.value;};
$("stops").onclick=e=>{stops=!stops;e.target.setAttribute("aria-pressed",String(stops));};
$("caps").onclick=e=>{showCaps=!showCaps;e.target.setAttribute("aria-pressed",String(showCaps));};
document.addEventListener("keydown",e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(k===" "){e.preventDefault();toggle();}
  else if(k==="ArrowRight"){e.preventDefault();goCh(1);}
  else if(k==="ArrowLeft"){e.preventDefault();goCh(-1);}
  else if(k==="."){T=Math.min(TOTAL,T+1/30);}
  else if(k===","){T=Math.max(0,T-1/30);}
  else if(k==="c"||k==="C")$("caps").click();
  else if(k==="p"||k==="P")$("stops").click();
  else if(k==="h"||k==="H"){document.body.classList.toggle("rec");setTimeout(fit,30);}
  else if(k==="f"||k==="F"){if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});}
});
window.__story={seek:s=>{T=s;},chapters:()=>CH.map(c=>[c.name,c.start,c.dur]),story:STORY,wstat:WSTAT,world:!!WORLD};
fit();
const start=()=>requestAnimationFrame(tick);
if(document.fonts&&document.fonts.load){Promise.race([document.fonts.load(`800 20px Nunito`),new Promise(r=>setTimeout(r,1500))]).then(start);}else start();
})();
</script>
</body>
