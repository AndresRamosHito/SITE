<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pollinaria and paternity: how orchid pollen shapes the next generation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EC; --bar:#FFFFFF; --text:#1F2A24; --muted:#5E6B63; --rule:#D3DBD4; --accent:#3F7A4C; --pink:#B5467F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#141A17;--bar:#1E2622;--text:#E7EEE9;--muted:#9AA8A0;--rule:#33403A;--accent:#8CC79A;--pink:#E08AB6;}
}
:root[data-theme="dark"]{--bg:#141A17;--bar:#1E2622;--text:#E7EEE9;--muted:#9AA8A0;--rule:#33403A;--accent:#8CC79A;--pink:#E08AB6;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Nunito,"Trebuchet MS",system-ui,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
#stagewrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
canvas{display:block;border-radius:6px;background:#000}
#bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bar);border-top:1px solid var(--rule);flex-wrap:wrap}
body.rec #bar{display:none}
body.rec{cursor:none}
button,select{font:700 15px Nunito,system-ui,sans-serif;color:var(--text);background:var(--bg);border:1px solid var(--rule);border-radius:6px;height:36px;padding:0 12px;cursor:pointer}
button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#play{min-width:84px}
#time{font:600 14px Nunito,system-ui,sans-serif;color:var(--muted);min-width:92px;font-variant-numeric:tabular-nums}
#scrubwrap{position:relative;flex:1;min-width:220px;height:36px}
#scrub{position:absolute;inset:0;width:100%;margin:0;accent-color:var(--accent)}
#marks{position:absolute;left:8px;right:8px;top:0;height:8px;pointer-events:none}
#marks span{position:absolute;top:0;width:2px;height:8px;background:var(--muted);opacity:.6}
#chap{font:700 14px Nunito,system-ui,sans-serif;color:var(--muted);min-width:200px}
.grp{display:flex;gap:6px;align-items:center}
</style>
</head>
<body>
<div id="app">
  <div id="stagewrap"><canvas id="cv" width="1600" height="900" aria-label="Animation: how orchid pollinaria concentrate paternity and shape the next generation"></canvas></div>
  <div id="bar">
    <button id="play" aria-label="Play or pause">Play</button>
    <span id="time">0:00 / 0:00</span>
    <div id="scrubwrap"><div id="marks"></div><input id="scrub" type="range" min="0" max="1000" step="1" value="0" aria-label="Timeline"></div>
    <span id="chap"></span>
    <div class="grp">
      <button id="prevc" aria-label="Previous chapter">Prev</button>
      <button id="nextc" aria-label="Next chapter">Next</button>
      <select id="speed" aria-label="Speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select>
      <button id="stops" aria-pressed="false" title="Pause at the end of every chapter">Pause per chapter</button>
      <button id="caps" aria-pressed="true">Captions</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
/* =====================================================================
   Pollinaria and paternity: a visual story of the orchid paternity model.
   Version 2, with the September 2026 art pass (drawing, layout, motion, colour,
   chapter transitions). Every frame is a pure function of time t, so the timeline
   can be scrubbed, paused and stepped for voice-over recording. Offscreen bitmaps
   (CACHE, SPR) only hold time-independent pictures and are rebuilt on resize.
   ===================================================================== */
const W=1600,H=900,TAU=Math.PI*2;
const cv=document.getElementById("cv");let ctx=cv.getContext("2d");
const FONT='Nunito,"Trebuchet MS",system-ui,sans-serif';

/* ---------- maths helpers ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const eseg=(t,a,b)=>ease(seg(t,a,b));
function mk(seed){let s=seed>>>0;return function(){s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function normalR(R){let u=0;while(u===0)u=R();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*R());}
function poissonR(R,l){if(l<=0)return 0;const L=Math.exp(-l);let k=0,p=1;do{k++;p*=R();}while(p>L);return k-1;}
function gammaR(R,a){if(a<1)return gammaR(R,a+1)*Math.pow(R(),1/a);const d=a-1/3,c=1/Math.sqrt(9*d);for(;;){let x,v;do{x=normalR(R);v=1+c*x;}while(v<=0);v=v*v*v;const u=R();if(u<1-0.0331*x*x*x*x)return d*v;if(Math.log(u)<0.5*x*x+d*(1-v+Math.log(v)))return d*v;}}
function pickW(R,items,wts){let s=0;for(const w of wts)s+=w;let u=R()*s;for(let i=0;i<items.length;i++){u-=wts[i];if(u<=0)return items[i];}return items[items.length-1];}
function shuffle(R,a){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- easing and smooth noise (all pure functions of their arguments) ---------- */
const easeOut=t=>1-Math.pow(1-t,3);
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeBack=(t,k)=>{if(t<=0)return 0;if(t>=1)return 1;k=k===undefined?1.3:k;const u=t-1;return 1+(k+1)*u*u*u+k*u*u;};
const smooth=t=>t*t*(3-2*t);
const wob=(t,s)=>0.5*Math.sin(t*1.73+s)+0.3*Math.sin(t*2.91+s*1.37)+0.2*Math.sin(t*4.37+s*2.11);
const lerpAng=(a,b,t)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return a+d*t;};
/* damped settle: 0 -> 1 with a small, quickly decaying overshoot */
const settle=(t,f,k)=>t<=0?0:1-Math.exp(-(k||5)*t)*Math.cos((f||9)*t);

/* ---------- colours ---------- */
const hsl=(h,s,l,a)=>a===undefined?`hsl(${h},${s}%,${l}%)`:`hsla(${h},${s}%,${l}%,${a})`;
/* Allele palette. Eight families, one per founding plant, each with a light and a dark allele tone and a
   mid tone for sire marks. Tuned (OKLab, Machado 2009 simulation) so that the families stay separable
   under deuteranopia, protanopia and tritanopia while keeping normal-vision separation, and so that the
   story's pollen donor (plant 2, blue) and seed parent (plant 5, orange) differ strongly for every viewer. */
const AL_LIGHT=["#FFB2C4","#CD96B4","#6CB8F4","#B2F5B6","#62D8D2","#E79D6C","#C9CCFF","#D9CF76"];
const AL_DARK=["#B2364A","#672C5D","#256A89","#2B693A","#008E83","#6F3300","#403398","#7F6A00"];
const AL_MID=["#E55365","#A23199","#3C8CCB","#658C44","#43ADAF","#C76800","#5760D3","#BCA044"];
const alleleCol=id=>{if(id>=16)return (id&1)?"#2E2E33":"#F2F2F2";const f=(id>>1)%8;return (id&1)?AL_DARK[f]:AL_LIGHT[f];};
const sireCol=f=>AL_MID[f%8];
const C={skyTop:"#9CC5DD",skyBot:"#E7F0E6",far:"#AFC7BA",trees:"#7FA476",treesDark:"#648A5F",hill:"#A5C495",hill2:"#8DB67C",
  grass:"#7BA761",grassDark:"#5E8C4A",soil:"#6B5743",soil2:"#433529",
  stem:"#4E8747",leaf:"#5F9B52",leafDark:"#3E7336",leafLight:"#8DBF73",
  wilt:"#B39C82",fruit:"#6E9E4E",fruitDark:"#4E7A37",pollen:"#F2C12E",pollenDark:"#B98A10",visc:"#6A4A2E",
  capBg:"rgba(14,26,20,0.86)",ink:"#1F2A24",muted:"#5E6B63",gold:"#F2B632",card:"#FBFBF8",line:"rgba(255,255,255,0.9)",
  cu0:"#18352A",cu1:"#284B38",cu2:"#365C42"};

/* ---------- drawing primitives ---------- */
function ell(x,y,rx,ry,rot,fill,stroke,lw){ctx.beginPath();ctx.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),rot||0,0,TAU);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();}}
function circ(x,y,r,fill,stroke,lw){ell(x,y,r,r,0,fill,stroke,lw);}
function rrect(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function hexRGB(h){const p=parseInt(h.slice(1),16);return[p>>16,p>>8&255,p&255];}
function mixHex(a,b,t){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const r=Math.round(lerp(pa>>16,pb>>16,t)),g=Math.round(lerp(pa>>8&255,pb>>8&255,t)),bl=Math.round(lerp(pa&255,pb&255,t));return `rgb(${r},${g},${bl})`;}
function mixHexRaw(a,b,t){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const h=v=>v.toString(16).padStart(2,"0");return "#"+h(Math.round(lerp(pa>>16,pb>>16,t)))+h(Math.round(lerp(pa>>8&255,pb>>8&255,t)))+h(Math.round(lerp(pa&255,pb&255,t)));}
const shade=(h,t)=>t<0?mixHexRaw(h,"#000000",-t):mixHexRaw(h,"#FFFFFF",t);
const rgba=(h,a)=>{const[r,g,b]=hexRGB(h);return `rgba(${r},${g},${b},${a})`;};
const lum=h=>{const c=hexRGB(h).map(v=>{v/=255;return v<=0.04045?v/12.92:Math.pow((v+0.055)/1.055,2.4);});return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];};
const inkOn=h=>lum(h)>0.3?C.ink:"#FFFFFF";
function text(s,x,y,size,col,align,weight,italic){ctx.font=`${italic?"italic ":""}${weight||700} ${size}px ${FONT}`;ctx.fillStyle=col;ctx.textAlign=align||"left";ctx.textBaseline="middle";ctx.fillText(s,x,y);}
function lines(s,maxW,size,weight){ctx.font=`${weight||700} ${size}px ${FONT}`;const out=[];let line="";for(const w of s.split(" ")){const t=line?line+" "+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;}if(line)out.push(line);return out;}
/* taxon names (genus, species, "C." abbreviation) are set in italic, as in the literature; set ITALIC_TAXA to false to draw them upright */
const ITALIC_TAXA=true;
const TAXON=new Set(["Eulophia","alta","Stanhopea","Ophrys","Habenaria","Platanthera","Asclepias","syriaca","Mimulus","ringens","Phalaenopsis","pulcherrima","Chiloglottis","valida","jeanesii","C.","Neozeleboria"]);
function rich(s,x,y,size,col,align,weight,allItalic){weight=weight||700;const isIt=w=>TAXON.has(w)||TAXON.has(w.replace(/[,;:.()]+$/,""));const toks=s.split(" ");
  if(allItalic||!ITALIC_TAXA||!toks.some(isIt)){text(s,x,y,size,col,align,weight,allItalic);return;}
  const f=it=>`${it?"italic ":""}${weight} ${size}px ${FONT}`;ctx.font=f(false);const sp=ctx.measureText(" ").width;const ws=toks.map(w=>{ctx.font=f(isIt(w));return ctx.measureText(w).width;});
  const tot=ws.reduce((a,b)=>a+b,0)+sp*(toks.length-1);let cx=align==="center"?x-tot/2:align==="right"?x-tot:x;ctx.fillStyle=col;ctx.textAlign="left";ctx.textBaseline="middle";
  toks.forEach((w,i)=>{ctx.font=f(isIt(w));ctx.fillText(w,cx,y);cx+=ws[i]+sp;});}
function para(s,x,y,maxW,size,col,lh,align,weight){const L=lines(s,maxW,size,weight);L.forEach((l,i)=>text(l,x,y+i*lh,size,col,align,weight));return L.length;}
function fade(a,fn){if(a<=0)return;ctx.save();ctx.globalAlpha*=a;fn();ctx.restore();}
/* white card with a soft contact shadow, used for every information panel */
function card(x,y,w,h,r,fill){r=r||16;ctx.save();ctx.shadowColor="rgba(8,20,14,0.28)";ctx.shadowBlur=22;ctx.shadowOffsetY=6;rrect(x,y,w,h,r);ctx.fillStyle=fill||C.card;ctx.fill();ctx.restore();rrect(x,y,w,h,r);ctx.strokeStyle="rgba(0,0,0,0.07)";ctx.lineWidth=1;ctx.stroke();}
function arrow(x1,y1,x2,y2,col,lw){ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=lw||2;ctx.lineCap="round";const a=Math.atan2(y2-y1,x2-x1),hl=10+(lw||2)*1.5;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2-Math.cos(a)*hl*0.6,y2-Math.sin(a)*hl*0.6);ctx.stroke();ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-hl*Math.cos(a-0.42),y2-hl*Math.sin(a-0.42));ctx.lineTo(x2-hl*0.72*Math.cos(a),y2-hl*0.72*Math.sin(a));ctx.lineTo(x2-hl*Math.cos(a+0.42),y2-hl*Math.sin(a+0.42));ctx.closePath();ctx.fill();ctx.lineCap="butt";}
/* soft elliptical shadow */
function softEll(x,y,rx,ry,a,col){if(a<=0||rx<=0||ry<=0)return;ctx.save();ctx.translate(x,y);ctx.scale(1,ry/rx);const g=ctx.createRadialGradient(0,0,0,0,0,rx);const c=col||"20,30,20";g.addColorStop(0,`rgba(${c},${a})`);g.addColorStop(0.55,`rgba(${c},${a*0.55})`);g.addColorStop(1,`rgba(${c},0)`);ctx.fillStyle=g;ctx.fillRect(-rx,-rx,2*rx,2*rx);ctx.restore();}
/* sample a cubic bezier */
function bezPts(p0,p1,p2,p3,n){const out=[];for(let i=0;i<=n;i++){const u=i/n,v=1-u;out.push([v*v*v*p0[0]+3*v*v*u*p1[0]+3*v*u*u*p2[0]+u*u*u*p3[0],v*v*v*p0[1]+3*v*v*u*p1[1]+3*v*u*u*p2[1]+u*u*u*p3[1]]);}return out;}
/* closed ribbon around a polyline with half-width wf(u); returns both edges */
function ribbon(pts,wf){const n=pts.length,L=[],R=[];for(let i=0;i<n;i++){const a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)];let dx=b[0]-a[0],dy=b[1]-a[1];const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;const w=wf(i/(n-1));L.push([pts[i][0]-dy*w,pts[i][1]+dx*w]);R.push([pts[i][0]+dy*w,pts[i][1]-dx*w]);}
  ctx.beginPath();ctx.moveTo(L[0][0],L[0][1]);for(let i=1;i<n;i++)ctx.lineTo(L[i][0],L[i][1]);for(let i=n-1;i>=0;i--)ctx.lineTo(R[i][0],R[i][1]);ctx.closePath();return{L,R};}
function polyStroke(P){ctx.beginPath();ctx.moveTo(P[0][0],P[0][1]);for(let i=1;i<P.length;i++)ctx.lineTo(P[i][0],P[i][1]);ctx.stroke();}
/* a curved organ grown along a direction that bends from a0 to a1 (radians, 0 = up) */
function curvePts(x,y,len,a0,a1,n,pw){const P=[[x,y]];let px=x,py=y;const ds=len/n;for(let i=1;i<=n;i++){const u=(i-0.5)/n;const a=a0+(a1-a0)*Math.pow(u,pw||1.4);px+=Math.sin(a)*ds;py-=Math.cos(a)*ds;P.push([px,py]);}return P;}
/* long plicate (pleated) leaf blade: used for Eulophia leaves and seedlings */
function leafBlade(P,wd,cBase,cTip,edge,pleats,lit){const {L,R}=ribbon(P,u=>wd*(0.22+0.78*Math.pow(Math.sin(Math.PI*Math.min(1,u*1.02)),0.85))*Math.pow(1-u,0.12));
  const a=P[0],b=P[P.length-1];const g=ctx.createLinearGradient(a[0],a[1],b[0],b[1]);g.addColorStop(0,cBase);g.addColorStop(0.55,mixHexRaw(cBase,cTip,0.6));g.addColorStop(1,cTip);ctx.fillStyle=g;ctx.fill();
  if(lit){ctx.save();ctx.clip();ctx.globalAlpha*=lit;ctx.strokeStyle="rgba(255,255,230,0.5)";ctx.lineWidth=wd*0.5;polyStroke(R.map((r,i)=>[lerp(r[0],P[i][0],0.25),lerp(r[1],P[i][1],0.25)]));ctx.restore();}
  if(pleats){ctx.lineWidth=Math.max(0.5,wd*0.07);for(const k of [-0.5,0,0.5]){const Q=P.map((p,i)=>[lerp(L[i][0],R[i][0],0.5+k*0.5),lerp(L[i][1],R[i][1],0.5+k*0.5)]);ctx.strokeStyle="rgba(20,50,15,0.22)";polyStroke(Q);ctx.strokeStyle="rgba(235,255,210,0.14)";polyStroke(Q.map(q=>[q[0]+wd*0.08,q[1]-wd*0.04]));}}
  if(edge){ribbon(P,u=>wd*(0.22+0.78*Math.pow(Math.sin(Math.PI*Math.min(1,u*1.02)),0.85))*Math.pow(1-u,0.12));ctx.strokeStyle=edge;ctx.lineWidth=Math.max(0.5,wd*0.06);ctx.stroke();}}

/* Allele badge: two beads in a pill */
function bead(x,y,r,col){const g=ctx.createRadialGradient(x+r*0.35,y-r*0.4,r*0.1,x,y,r*1.05);g.addColorStop(0,shade(col,0.28));g.addColorStop(0.55,col);g.addColorStop(1,shade(col,-0.12));circ(x,y,r,g,shade(col,-0.45),Math.max(0.8,r*0.12));}
function beads(x,y,a,b,r,alpha){if(alpha<=0)return;ctx.save();ctx.globalAlpha*=alpha;r=r||7;rrect(x-r*2.6,y-r*1.45,r*5.2,r*2.9,r*1.45);ctx.fillStyle="rgba(255,255,255,0.96)";ctx.fill();ctx.strokeStyle="rgba(30,40,35,0.45)";ctx.lineWidth=Math.max(1,r*0.13);ctx.stroke();bead(x-r*1.2,y,r,alleleCol(a));bead(x+r*1.2,y,r,alleleCol(b));ctx.restore();}

/* Chromosome (one chromatid) with a centromere constriction and one gene locus marked */
function chromo(x,y,len,w,allele,alpha,label){fade(alpha,()=>{const top=y-len/2,cen=top+len*0.44;
  const body=()=>{ctx.beginPath();ctx.moveTo(x-w/2,top+w/2);ctx.arc(x,top+w/2,w/2,Math.PI,0);ctx.lineTo(x+w/2,cen-w*0.55);ctx.quadraticCurveTo(x+w*0.18,cen,x+w/2,cen+w*0.55);ctx.lineTo(x+w/2,y+len/2-w/2);ctx.arc(x,y+len/2-w/2,w/2,0,Math.PI);ctx.lineTo(x-w/2,cen+w*0.55);ctx.quadraticCurveTo(x-w*0.18,cen,x-w/2,cen-w*0.55);ctx.closePath();};
  body();const g=ctx.createLinearGradient(x-w/2,0,x+w/2,0);g.addColorStop(0,"#7C8198");g.addColorStop(0.45,"#C3C7D8");g.addColorStop(1,"#8E93AA");ctx.fillStyle=g;ctx.fill();
  ctx.save();body();ctx.clip();ctx.fillStyle="rgba(60,64,85,0.22)";for(const f of [0.08,0.3,0.6,0.72,0.86])ctx.fillRect(x-w/2,top+len*f,w,len*0.035);
  ctx.fillStyle=alleleCol(allele);ctx.fillRect(x-w/2,top+len*0.17,w,len*0.11);ctx.fillStyle="rgba(255,255,255,0.25)";ctx.fillRect(x-w/2,top+len*0.17,w,len*0.025);ctx.restore();
  body();ctx.strokeStyle="rgba(30,34,50,0.55)";ctx.lineWidth=1.2;ctx.stroke();
  if(label)text(label,x,y+len/2+22,18,"#FFFFFF","center",700);});}

/* effective pixels per stage unit under the current transform (for level of detail) */
let VIEW_TF=null,BASE_S=1,CAM=null;
function viewZoom(){const m=ctx.getTransform();return Math.hypot(m.a,m.b)/BASE_S;}

/* Orchid flower, front view, centred on its column. s = size scale. */
function flower(x,y,s,o){
  /* Stylised Eulophia alta, front view, centred on the column.
     Lanceolate bronze-maroon tepals over green, three-lobed labellum:
     side lobes around the column, pale disc with raised keels, frilled crimson midlobe.
     Anther cap near (0,-10.5); viscidium near (0,-6); stigma under the column tip near (0,1). */
  o=o||{};const open=o.open===undefined?1:o.open;if(open<=0)return;
  if(offView(x-60*s,y-60*s,x+60*s,y+45*s))return;
  const w=o.wilt||0;ctx.save();ctx.translate(x,y);ctx.globalAlpha*=(o.alpha===undefined?1:o.alpha)*(1-w*0.55);

/* Flight through keyed poses [time, x, y, heading]. Positions follow a cubic Hermite spline that comes to rest

function flyPath(K,t){const n=K.length;if(t<=K[0][0])return K[0].slice(1);if(t>=K[n-1][0])return K[n-1].slice(1);

  const same=(a,b)=>Math.abs(a[1]-b[1])<0.5&&Math.abs(a[2]-b[2])<0.5;
  const tan=j=>{const lo=Math.max(0,j-1),hi=Math.min(n-1,j+1);if((j>0&&same(K[j],K[j-1]))||(j<n-1&&same(K[j],K[j+1])))return[0,0];const dt=K[hi][0]-K[lo][0];return[(K[hi][1]-K[lo][1])/dt,(K[hi][2]-K[lo][2])/dt];};
  const a=K[i],b=K[i+1],h=b[0]-a[0],u=(t-a[0])/h,m0=tan(i),m1=tan(i+1);

  return[h00*a[1]+h10*h*m0[0]+h01*b[1]+h11*h*m1[0],h00*a[2]+h10*h*m0[1]+h01*b[2]+h11*h*m1[1],lerpAng(a[3],b[3],smooth(u))];}

/* ---------- the founding story, chosen from a seeded draw ---------- */
function makeStory(seed){
  const R=mk(seed);
  const wts={};FLOWERING.forEach(i=>wts[i]=gammaR(R,0.6));
  const fruits=[],unvisited=[];
  for(const m of FLOWERING)for(let slot=0;slot<2;slot++){
    if(m===5&&slot===0){fruits.push({m,slot,f:2,pass:true,story:true});continue;}
    if(R()<0.7){const cand=FLOWERING.filter(j=>j!==m);const f=pickW(R,cand,cand.map(j=>wts[j]));const fr={m,slot,f,pass:R()<0.5};
      if(R()<0.3){const c2=cand.filter(j=>j!==f);fr.f2=pickW(R,c2,c2.map(j=>wts[j]));fr.s2=0.15+R()*0.2;}fruits.push(fr);}
    else unvisited.push({m,slot});
  }
  const seedlings=[];
  fruits.forEach((fr,fi)=>{if(!fr.pass)return;const n=2+poissonR(R,2.3);for(let k=0;k<n;k++){const sire=(fr.f2!==undefined&&R()<fr.s2)?fr.f2:fr.f;seedlings.push({fi,m:fr.m,f:sire,a:fr.m*2+(R()<.5?1:0),b:sire*2+(R()<.5?1:0)});}});
  const nS=seedlings.length;if(nS<18||nS>28)return null;
  const nF=fruits.length,nP=fruits.filter(f=>f.pass).length;if(nF<9||nF>12||nP<4||nP>7)return null;
  if(!fruits.some(f=>f.f2!==undefined&&f.pass))return null;
  const idx=shuffle(R,seedlings.map((_,i)=>i));const winners=idx.slice(0,8);const wset=new Set(winners);
  const NSL=28,slotX=k=>70+k*(1460/(NSL-1));
  const wSlots=[...Array(8)].map((_,k)=>Math.round((k+0.5)*NSL/8-0.5));
  const free=shuffle(R,[...Array(NSL).keys()].filter(k=>!wSlots.includes(k)));
  let wi=0,li=0;seedlings.forEach((s,i)=>{s.win=wset.has(i);s.x=slotX(s.win?wSlots[wi++]:free[li++]);s.wrank=s.win?winners.indexOf(i):-1;});
  const tally=Array(8).fill(0);seedlings.forEach(s=>{if(s.win)tally[s.f]++;});
  const zeros=FLOWERING.filter(i=>tally[i]===0).length;const mx=Math.max(...tally);
  if(mx<3||mx>4||zeros<3||tally.filter(v=>v>=2).length<2)return null;
  if(!seedlings.some(s=>s.win&&s.fi===0))return null;
  const trips=shuffle(R,fruits.map((_,i)=>i).filter(i=>!fruits[i].story));
  trips.forEach((fi,k)=>{fruits[fi].t0=0.6+k*0.85;});
  fruits.forEach(fr=>{fr.dust=[...Array(34)].map(()=>({vx:(R()-.3)*170,vy:-(40+R()*120),sway:R()*TAU,life:4+R()*2.5}));});
  const flick=[...Array(60)].map(()=>Math.floor(R()*nS));
  return {fruits,unvisited,seedlings,winners,tally,flick,seed};
}

const LOW={lam:1.2,e:0.62,al:0.7,b:3,kmax:4},GRAN={lam:3.5,e:0,al:1.5,b:1,kmax:8};
function runWorld(reg,seed,N,G,init){
  const R=mk(seed);let pop=init.map(p=>p.slice());const gens=[];
  for(let g=0;g<=G;g++){
    const rec={pop:pop.map(p=>p.slice()),tally:null,colours:new Set(pop.flat()).size};gens.push(rec);if(g===G)break;
    const fl=[];pop.forEach((p,i)=>{if(R()<0.7)fl.push(i);});if(fl.length<2)break;
    const w=fl.map(()=>gammaR(R,0.6));const kids=[];
    fl.forEach(m=>{let nf=0;const nfl=poissonR(R,6);for(let k=0;k<nfl;k++)if(R()<0.25)nf++;
      for(let k=0;k<nf;k++){
        const draw=()=>{for(;;){const f=pickW(R,fl,w);if(f!==m)return f;}};
        let extra=0;const D=poissonR(R,reg.lam);for(let j=0;j<D;j++)if(R()<1-reg.e)extra++;
        const kk=Math.min(1+extra,reg.kmax);const fathers=[];for(let j=0;j<kk;j++)fathers.push(draw());
        let shares;if(kk===1)shares=[1];else{const al=fathers.map(()=>reg.al);al[0]*=reg.b;const gs=al.map(a=>gammaR(R,a));const s=gs.reduce((a,b)=>a+b,0);shares=gs.map(x=>x/s);}
        if(R()>=0.5)continue;const nr=poissonR(R,10);
        for(let r=0;r<nr;r++){const f=pickW(R,fathers,shares);kids.push({a:pop[m][R()<.5?0:1],b:pop[f][R()<.5?0:1],f});}
      }});
    shuffle(R,kids);const keep=kids.slice(0,N);
    const tally=Array(N).fill(0);keep.forEach(k=>tally[k.f]++);rec.tally=tally;
    if(keep.length<2)break;pop=keep.map(k=>[k.a,k.b]);
  }
  return gens;
}

    text("model settings compared",800,106,20,C.muted,"center",800);ctx.fillStyle="rgba(0,0,0,0.08)";ctx.fillRect(330,130,940,1);
    [["lower input","x = 0.01, m = 0","1 sire in 100 from outside, no immigrants"],["higher input","x = 0.25, m = 0.03","1 sire in 4 from outside, about 15 immigrants per 500"]].forEach(([a,b,c],i)=>{const y=172+i*76;
      circ(344,y,7,i?"#3F7A4C":"#B9C8BC");text(a,364,y,24,C.ink,"left",800);text(b,560,y,24,C.ink,"left",800);text(c,560,y+28,17,C.muted,"left",700);});
    fade(eseg(t,16,16.8),()=>{ctx.fillStyle="rgba(0,0,0,0.07)";ctx.fillRect(330,300,940,1);});ctx.restore();});
  fade(eseg(t,16,16.8),()=>{const e=easeOut(seg(t,16,16.8));ctx.save();ctx.translate(0,(1-e)*14);card(300,338,1000,114,18);ctx.fillStyle="#3F7A4C";rrect(300,338,8,114,4);ctx.fill();
    text("more input: smaller allele-diversity difference between regimes",800,374,22,C.ink,"center",800);text("sire inequality still higher with concentrated paternity",800,414,22,C.ink,"center",800);ctx.restore();});
});

/* 16 */
chapter("What to remember",16,[[0,""]],function(t){
  newGen(t);ctx.fillStyle="rgba(12,22,17,0.5)";ctx.fillRect(0,0,W,H);
  const L=["Pollinaria deliver pollen in cohesive pollinia, so a capsule's seeds are usually sired mostly by one donor.",
           "After seedlings compete for limited space, a few sires leave many offspring and many leave none.",
           "The overall allele mix changes much less. How much depends on population size and incoming pollen."];
  L.forEach((s,i)=>{const t0=0.6+i*3.2;const a=eseg(t,t0,t0+1);fade(a,()=>{const e=easeOut(seg(t,t0,t0+1));const y0=90+i*205;ctx.save();ctx.translate((1-e)*-24,0);
    card(240,y0,1120,175,18);ctx.save();rrect(240,y0,1120,175,18);ctx.clip();ctx.fillStyle="#3F7A4C";ctx.fillRect(240,y0,8,175);ctx.restore();
    const g=ctx.createRadialGradient(302,y0+80,4,310,y0+87,28);g.addColorStop(0,"#5E9A6A");g.addColorStop(1,"#2F6A3E");circ(310,y0+87,27,g);text(String(i+1),310,y0+88,26,"#FFFFFF","center",800);
    const L2=lines(s,940,31,800);L2.forEach((l,j)=>text(l,370,y0+87-(L2.length-1)*21+j*42,31,C.ink,"left",800));ctx.restore();});});
});

let acc=0;CH.forEach(c=>{c.start=acc;acc+=c.dur;});const TOTAL=acc;

/* ---------- captions and chapter label ---------- */
let showCaps=true;
function drawOverlay(ci,lt){
  const c=CH[ci];
  fade(0.94*(1-eseg(lt,4,5)),()=>{ctx.font=`800 22px ${FONT}`;const num=`${ci+1}  `,nw=ctx.measureText(num).width,w=ctx.measureText(num+c.name).width+36;
    ctx.save();ctx.shadowColor="rgba(0,0,0,0.22)";ctx.shadowBlur=10;ctx.shadowOffsetY=2;rrect(28,24,w,44,22);ctx.fillStyle="rgba(255,255,255,0.94)";ctx.fill();ctx.restore();
    text(num,46,47,22,"#3F7A4C","left",800);text(c.name,46+nw,47,22,C.ink,"left",800);});
  if(!showCaps)return;
  let cap=null,cs=0;for(const [ts,s] of c.caps){if(lt>=ts){cap=s;cs=ts;}}
  if(!cap)return;
  fade(eseg(lt,cs,cs+0.4),()=>{const L=lines(cap,1180,29,700);const h=L.length*40+28;rrect(800-640,H-h-26,1280,h,16);ctx.fillStyle=C.capBg;ctx.fill();ctx.strokeStyle="rgba(255,255,255,0.08)";ctx.lineWidth=1;ctx.stroke();
    L.forEach((l,i)=>rich(l,800,H-h-26+34+i*40,29,"#FFFFFF","center",700));});
}

/* ---------- render and player ---------- */
let T=0,playing=false,speed=1,stops=false,lastNow=null,scale=1;
function chapterAt(t){for(let i=CH.length-1;i>=0;i--)if(t>=CH[i].start)return i;return 0;}
/* ---------- transitions between chapters ----------
   TR[i] says how chapter i is entered from chapter i-1 during its first d seconds. Both frames stay pure
   functions of time: the outgoing chapter is held on its last frame. Kinds:
   dissolve  the outgoing frame fades over the incoming one;
   zoomIn    the camera pushes into a detail of the outgoing frame (focus f) while the incoming scene settles in;
   recede    the outgoing frame falls back and fades; the incoming one can settle from a closer framing (zoom z about f);
   cut       a straight cut, used where the two frames are continuous. */
const TR={1:{k:"zoomIn",d:1.2,f:[PX(2)+10,GY-270],zm:4.5},2:{k:"recede",d:1.0},3:{k:"dissolve",d:0.5},4:{k:"cut"},5:{k:"dissolve",d:0.8},6:{k:"dissolve",d:0.6},
  7:{k:"zoomIn",d:1.1,f:[1200,330]},8:{k:"dissolve",d:0.8},9:{k:"dissolve",d:0.45},10:{k:"dissolve",d:0.7},11:{k:"dissolve",d:0.7},
  12:{k:"zoomIn",d:1.2,f:[611,126]},13:{k:"recede",d:1.3,z:1.3,f:[800,420]},14:{k:"dissolve",d:0.4},15:{k:"dissolve",d:0.5},16:{k:"dissolve",d:0.5},
  17:{k:"dissolve",d:0.7},18:{k:"dissolve",d:0.8},19:{k:"dissolve",d:0.9},20:{k:"dissolve",d:0.9}};
function drawCh(i,lt){ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();VIEW_TF=ctx.getTransform();CAM=null;CH[i].draw(lt);ctx.restore();CAM=null;}
function aboutPt(x,y,z,sx,sy){ctx.translate(sx,sy);ctx.scale(z,z);ctx.translate(-x,-y);}
function render(){
  const dpr=window.devicePixelRatio||1;ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);ctx.clearRect(0,0,W,H);
  BASE_S=scale*dpr;
  if(BASE_S!==CACHE_S){for(const k in CACHE)delete CACHE[k];for(const k in SPR)delete SPR[k];CACHE_S=BASE_S;}
  const ci=chapterAt(T),lt=T-CH[ci].start;const tr=TR[ci]||{k:"dissolve",d:0.5};
  if(ci>0&&tr.k!=="cut"&&lt<tr.d){const p=lt/tr.d,prev=()=>drawCh(ci-1,CH[ci-1].dur-0.001);
    if(tr.k==="zoomIn"){const f=tr.f,zm=tr.zm||3.2,e=Math.pow(p,1.7),z=Math.exp(Math.log(zm)*e),k=(z-1)/(zm-1);
      ctx.save();ctx.fillStyle=C.cu0;ctx.fillRect(0,0,W,H);ctx.globalAlpha=smooth(clamp((p-0.28)/0.62,0,1));const sN=lerp(0.9,1,easeOut(clamp((p-0.2)/0.8,0,1)));aboutPt(800,450,sN,800,450);drawCh(ci,lt);ctx.restore();
      ctx.save();ctx.globalAlpha=1-smooth(clamp((p-0.2)/0.62,0,1));aboutPt(f[0],f[1],z,lerp(f[0],800,k),lerp(f[1],450,k));prev();ctx.restore();}
    else if(tr.k==="recede"){const f=tr.f||[800,450];ctx.save();if(tr.z){const z=lerp(tr.z,1,easeOut(p));aboutPt(f[0],f[1],z,f[0],f[1]);}drawCh(ci,lt);ctx.restore();
      ctx.save();ctx.globalAlpha=1-smooth(clamp(p*1.25,0,1));const z=lerp(1,0.9,easeOut(p));aboutPt(800,450,z,800,450);ctx.save();ctx.shadowColor="rgba(0,0,0,0.4)";ctx.shadowBlur=40;ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);ctx.restore();prev();ctx.restore();}
    else{drawCh(ci,lt);ctx.save();ctx.globalAlpha=1-easeIO(p);prev();ctx.restore();}}
  else drawCh(ci,lt);
  drawOverlay(ci,lt);ui(ci);
}
const $=id=>document.getElementById(id);
const fmtT=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
function ui(ci){$("time").textContent=`${fmtT(T)} / ${fmtT(TOTAL)}`;$("scrub").value=Math.round(T/TOTAL*1000);$("chap").textContent=`${ci+1}. ${CH[ci].name}`;$("play").textContent=playing?"Pause":"Play";}
function tick(now){
  if(playing){if(lastNow!==null){const dt=Math.min(0.1,(now-lastNow)/1000)*speed;const ci=chapterAt(T);const end=CH[ci].start+CH[ci].dur;let nt=T+dt;
      if(stops&&T<end-0.02&&nt>=end-0.02){nt=end-0.02;playing=false;}
      T=Math.min(TOTAL,nt);if(T>=TOTAL)playing=false;}
    lastNow=now;}else lastNow=null;
  render();requestAnimationFrame(tick);
}
function fit(){const wrap=$("stagewrap");const aw=wrap.clientWidth-8,ah=wrap.clientHeight-8;scale=Math.max(0.1,Math.min(aw/W,ah/H));const dpr=window.devicePixelRatio||1;
  cv.style.width=Math.round(W*scale)+"px";cv.style.height=Math.round(H*scale)+"px";cv.width=Math.round(W*scale*dpr);cv.height=Math.round(H*scale*dpr);}
window.addEventListener("resize",fit);
const marks=$("marks");CH.forEach(c=>{const s=document.createElement("span");s.style.left=(c.start/TOTAL*100)+"%";marks.appendChild(s);});
function toggle(){if(T>=TOTAL-0.01)T=0;playing=!playing;}
function goCh(d){const ci=chapterAt(T);const lt=T-CH[ci].start;let n=ci+d;if(d<0&&lt>1.5)n=ci;T=CH[clamp(n,0,CH.length-1)].start;}
$("play").onclick=toggle;$("prevc").onclick=()=>goCh(-1);$("nextc").onclick=()=>goCh(1);
$("scrub").oninput=e=>{T=e.target.value/1000*TOTAL;};
$("speed").onchange=e=>{speed=+e.target.value;};
$("stops").onclick=e=>{stops=!stops;e.target.setAttribute("aria-pressed",String(stops));};
$("caps").onclick=e=>{showCaps=!showCaps;e.target.setAttribute("aria-pressed",String(showCaps));};
document.addEventListener("keydown",e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(k===" "){e.preventDefault();toggle();}
  else if(k==="ArrowRight"){e.preventDefault();goCh(1);}
  else if(k==="ArrowLeft"){e.preventDefault();goCh(-1);}
  else if(k==="."){T=Math.min(TOTAL,T+1/30);}
  else if(k===","){T=Math.max(0,T-1/30);}
  else if(k==="c"||k==="C")$("caps").click();
  else if(k==="p"||k==="P")$("stops").click();
  else if(k==="h"||k==="H"){document.body.classList.toggle("rec");setTimeout(fit,30);}
  else if(k==="f"||k==="F"){if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});}
});
window.__story={seek:s=>{T=s;},chapters:()=>CH.map(c=>[c.name,c.start,c.dur]),story:STORY,wstat:WSTAT,world:!!WORLD};
fit();
const start=()=>requestAnimationFrame(tick);
if(document.fonts&&document.fonts.load){Promise.race([document.fonts.load(`800 20px Nunito`),new Promise(r=>setTimeout(r,1500))]).then(start);}else start();
})();
</script>
